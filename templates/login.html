<!doctype html>
<html lang="en">
<head>
	<title>Login</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Arizonia&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

	<link rel="stylesheet" href="static/css/animate.css">
	<link rel="stylesheet" href="static/css/owl.carousel.min.css">
	<link rel="stylesheet" href="static/css/owl.theme.default.min.css">
	<link rel="stylesheet" href="static/css/magnific-popup.css">
	<link rel="stylesheet" href="static/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="static/css/jquery.timepicker.css">
	<link rel="stylesheet" href="static/css/flaticon.css">
	<link rel="stylesheet" href="static/css/style.css">

	<style>
		/* Custom field/button styling - kept in sync with register.html */
		.login-wrap {
		  position: relative;
		  color: rgba(255, 255, 255, 0.9); }
		  .login-wrap h3 {
		    font-weight: 300;
		    color: #fff; }
		  .login-wrap .social {
		    width: 100%; }
		    .login-wrap .social a {
		      width: 100%;
		      display: block;
		      border: 1px solid rgba(255, 255, 255, 0.4);
		      color: #000;
		      background: #fff; }
		      .login-wrap .social a:hover {
		        background: #000;
		        color: #fff;
		        border-color: #000; }

		.form-group {
		  position: relative; }

		.field-icon {
		  position: absolute;
		  top: 50%;
		  right: 15px;
		  -webkit-transform: translateY(-50%);
		  -ms-transform: translateY(-50%);
		  transform: translateY(-50%);
		  color: rgba(255, 255, 255, 0.9); }

		.form-control {
		  background: transparent;
		  border: none;
		  height: 50px;
		  color: rgb(0, 0, 0) !important;
		  border: 1px solid transparent;
		  background: transparent;
		  border-radius: 60px;
		  padding-left: 20px;
		  padding-right: 20px;
		  -webkit-transition: 0.3s;
		  -o-transition: 0.3s;
		  transition: 0.3s; }
		  .form-control::-webkit-input-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control::-moz-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control:-ms-input-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control:-moz-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control:hover, .form-control:focus {
		    background: transparent;
		    outline: none;
		    -webkit-box-shadow: none;
		    box-shadow: none;
		    border-color: rgba(255, 255, 255, 0.4); }
		  .form-control:focus {
		    border-color: rgba(255, 255, 255, 0.4); }

		textarea.form-control {
		  height: inherit !important; }

		.checkbox-wrap {
		  display: block;
		  position: relative;
		  padding-left: 30px;
		  margin-bottom: 12px;
		  cursor: pointer;
		  font-size: 16px;
		  font-weight: 500;
		  -webkit-user-select: none;
		  -moz-user-select: none;
		  -ms-user-select: none;
		  user-select: none; }

		.checkbox-wrap input {
		  position: absolute;
		  opacity: 0;
		  cursor: pointer;
		  height: 0;
		  width: 0; }

		.checkmark {
		  position: absolute;
		  top: 0;
		  left: 0; }

		.checkmark:after {
		  content: "\f0c8";
		  font-family: "FontAwesome";
		  position: absolute;
		  color: rgba(255, 255, 255, 0.1);
		  font-size: 20px;
		  margin-top: -4px;
		  -webkit-transition: 0.3s;
		  -o-transition: 0.3s;
		  transition: 0.3s; }

		.checkbox-wrap input:checked ~ .checkmark:after {
		  display: block;
		  content: "\f14a";
		  font-family: "FontAwesome";
		  color: rgba(0, 0, 0, 0.2); }

		.checkbox-primary {
		  color: #fbceb5; }
		  .checkbox-primary input:checked ~ .checkmark:after {
		    color: #fbceb5; }

		.btn {
		  border-radius: 60px; }

		.btn.btn-primary {
		  background: #ff772d !important;
		  border: 1px solid #ff772d !important;
		  border-radius: 60px !important;
		  color: #000 !important; }
		  .btn.btn-primary:hover {
		    border: 1px solid #ff772d;
		    background: transparent;
		    color: #ff772d; }
		  .btn.btn-primary.btn-outline-primary {
		    border: 1px solid #ff772d;
		    background: transparent;
		    color: #ff772d; }
		    .btn.btn-primary.btn-outline-primary:hover {
		      border: 1px solid transparent;
		      background: #ff772d;
		      color: #fff; }

          .forgot-password-btn {
              display: inline-block;
              padding: 10px 25px;
              border-radius: 60px;
              background: rgba(255, 255, 255, 0.15);
              border: 1px solid rgba(255, 255, 255, 0.4);
              color: #fff;
              text-decoration: none;
              transition: all 0.3s ease;
              font-size: 14px;
              font-weight: 500;
          }

          .forgot-password-btn:hover {
              background: #ff772d;
              border-color: #ff772d;
              color: #fff;
              text-decoration: none;
          }
          .forgot-link {
              color: #ffffff;
              font-weight: 500;
          }

          .forgot-link:hover {
              color: #ff772d;
              text-decoration: none;
          }

          .register-text p {
              color: #ffffff;
              margin-bottom: 0;
          }

          .register-link {
              color: #fff;
              font-weight: 600;
              transition: 0.3s;
          }

          .register-link:hover {
              color: #ff772d;
              text-decoration: none;
          }
	</style>

</head>
<body class="img js-fullheight" style="background-image: url(/static/images/bg.jpg);">

	<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
		<div class="container">
			<a class="navbar-brand" href="/home">SN | Tours<span>Travel Agency</span></a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="oi oi-menu"></span> Menu
			</button>

			<div class="collapse navbar-collapse" id="ftco-nav">
				<ul class="navbar-nav ml-auto">
					<li class="nav-item"><a href="/home" class="nav-link">Home</a></li>
					<li class="nav-item"><a href="/register" class="nav-link">Register</a></li>
					<li class="nav-item active"><a href="/login" class="nav-link">Login</a></li>
				</ul>
			</div>
		</div>
	</nav>
	<!-- END nav -->

	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">Login</h2>
				</div>
			</div>

			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-4">
					<div class="login-wrap p-0">
						<form action="/login" method="post" class="signin-form">
              
							<div class="form-group">
								<input type="text" name="email" class="form-control" placeholder="email" required>
							</div>
							<div class="form-group">
								<input id="password-field" type="password" name="password" class="form-control" placeholder="Password" required>
								<span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
							</div>
              {% if msg %}
              <div class="text-center mb-3">
                  <span style="
                      color: #ff4d4d;
                      font-weight: 600;
                      background: rgba(255,255,255,0.15);
                      padding: 8px 15px;
                      border-radius: 20px;
                      display: inline-block;
                  ">
                      {{ msg }}
                  </span>
              </div>
              {% endif %}
							<div class="form-group">
                  <button type="submit" class="form-control btn btn-primary submit px-3">
                      Sign In
                  </button>
              </div>

              

              <div class="form-group text-center">
    <a href="/forgotpassword" class="forgot-link">
        Forgot Password?
    </a>
</div>
						</form>
						<div class="register-text text-center">
    <p>
        Don't have an account?
        <a href="/register" class="register-link">
            Register here
        </a>
    </p>
</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- loader -->
	<div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>

	<script src="/static/js/jquery.min.js"></script>
	<script src="/static/js/jquery-migrate-3.0.1.min.js"></script>
	<script src="/static/js/popper.min.js"></script>
	<script src="/static/js/bootstrap.min.js"></script>
	<script src="/static/js/jquery.easing.1.3.js"></script>
	<script src="/static/js/jquery.stellar.min.js"></script>
	<script src="/static/js/owl.carousel.min.js"></script>
	<script src="/static/js/jquery.waypoints.min.js"></script>
	<script src="/static/js/jquery.magnific-popup.min.js"></script>
	<script src="/static/js/jquery.animateNumber.min.js"></script>
	<script src="/static/js/bootstrap-datepicker.js"></script>
	<script src="/static/js/scrollax.min.js"></script>
	<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false"></script>
	<script src="/static/js/google-map.js"></script>
	<script src="/static/js/main.js"></script>

</body>
</html>
