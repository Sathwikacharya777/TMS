	<style>
		/* Original input/field styling preserved as-is - do not change */
		.login-wrap {
		  position: relative;
		  color: rgba(255, 255, 255, 0.9); }
		  .login-wrap h3 {
		    font-weight: 300;
		    color: #fff; }
		  .login-wrap .social {
		    width: 100%; }
		    .login-wrap .social a {
		      width: 100%;
		      display: block;
		      border: 1px solid rgba(255, 255, 255, 0.4);
		      color: #000;
		      background: #fff; }
		      .login-wrap .social a:hover {
		        background: #000;
		        color: #fff;
		        border-color: #000; }

		.form-group {
		  position: relative; }

		.field-icon {
		  position: absolute;
		  top: 50%;
		  right: 15px;
		  -webkit-transform: translateY(-50%);
		  -ms-transform: translateY(-50%);
		  transform: translateY(-50%);
		  color: rgba(0, 0, 0, 0.9); }

		.form-control {
		  background: transparent;
		  border: none;
		  height: 50px;
		  color: rgb(0, 0, 0) !important;
		  border: 1px solid transparent;
		  background: transparent;
		  border-radius: 60px;
		  padding-left: 20px;
		  padding-right: 20px;
		  -webkit-transition: 0.3s;
		  -o-transition: 0.3s;
		  transition: 0.3s; }
		  .form-control::-webkit-input-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control::-moz-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control:-ms-input-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control:-moz-placeholder {
		    color: rgba(90, 90, 90, 0.8) !important; }
		  .form-control:hover, .form-control:focus {
		    background: transparent;
		    outline: none;
		    -webkit-box-shadow: none;
		    box-shadow: none;
		    border-color: rgba(0, 0, 0, 0.4); }
		  .form-control:focus {
		    border-color: rgba(60, 60, 60, 0.4); }

		textarea.form-control {
		  height: inherit !important; }

		.checkbox-wrap {
		  display: block;
		  position: relative;
		  padding-left: 30px;
		  margin-bottom: 12px;
		  cursor: pointer;
		  font-size: 16px;
		  font-weight: 500;
		  -webkit-user-select: none;
		  -moz-user-select: none;
		  -ms-user-select: none;
		  user-select: none; }

		.checkbox-wrap input {
		  position: absolute;
		  opacity: 0;
		  cursor: pointer;
		  height: 0;
		  width: 0; }

		.checkmark {
		  position: absolute;
		  top: 0;
		  left: 0; }

		.checkmark:after {
		  content: "\f0c8";
		  font-family: "FontAwesome";
		  position: absolute;
		  color: rgba(255, 255, 255, 0.1);
		  font-size: 20px;
		  margin-top: -4px;
		  -webkit-transition: 0.3s;
		  -o-transition: 0.3s;
		  transition: 0.3s; }

		.checkbox-wrap input:checked ~ .checkmark:after {
		  display: block;
		  content: "\f14a";
		  font-family: "FontAwesome";
		  color: rgba(0, 0, 0, 0.2); }

		.checkbox-primary {
		  color: #ff823f; }
		  .checkbox-primary input:checked ~ .checkmark:after {
		    color: #ff823e; }

		.btn {
		  border-radius: 60px; }

		.btn.btn-primary {
		  background: #ff6f22 !important;
		  border: 1px solid #ff6d1f !important;
		  border-radius: 60px !important;
		  color: #000 !important; }
		  .btn.btn-primary:hover {
		    border: 1px solid #fbceb5;
		    background: transparent;
		    color: #fbceb5; }
		  .btn.btn-primary.btn-outline-primary {
		    border: 1px solid #fbceb5;
		    background: transparent;
		    color: #fbceb5; }
		    .btn.btn-primary.btn-outline-primary:hover {
		      border: 1px solid transparent;
		      background: #fbceb5;
		      color: #fff; }
    .login-text p {
        color: #ffffff;
        margin-bottom: 0;
    }

    .login-link {
        color: #fff;
        font-weight: 600;
        transition: 0.3s;
    }

    .login-link:hover {
        color: #ff772d;
        text-decoration: none;
    }
	</style>

</head>
<body class="img js-fullheight" style="background-image: url(/static/images/bg.jpg);">

	<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
		<div class="container">
			<a class="navbar-brand" href="/home">SN | Tours<span>Travel Agency</span></a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="oi oi-menu"></span> Menu
			</button>

			<div class="collapse navbar-collapse" id="ftco-nav">
				<ul class="navbar-nav ml-auto">
					<li class="nav-item"><a href="/home" class="nav-link">Home</a></li>
					<li class="nav-item active"><a href="/register" class="nav-link">Register</a></li>

	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h1 class="heading-section">Register</h1>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-4">
					<div class="login-wrap p-0">
						<form action="/register" method="POST" class="signin-form">
							<div class="form-group">
								<input type="text" name="username" class="form-control" placeholder="Username" required>
							</div>
							<div class="form-group">
								<input type="email" name="email" class="form-control" placeholder="Email" required>
							</div>
							<div class="form-group">
								<input type="tel" name="phone" class="form-control" placeholder="Phone number" required>
							</div>
							<div class="form-group">
								<input type="password" name="password" class="form-control" placeholder="Password" required>
							</div>
							<div class="form-group">
								<input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
							</div>
              {% if msg %}
              <div style="color: red;">{{ msg }}</div>
              {% endif %}
							<div class="form-group">
								<button type="submit" class="form-control btn btn-primary submit px-3">Sign Up</button>
							</div>
						</form>
						<div class="login-text text-center">
                <p>
                    Already have an account?
                    <a href="/login" class="login-link">
                        Login here
                    </a>
                </p>
            </div>
						<br>
						
					</div>
				</div>
			</div>
		</div>
	</section>

<!-- Scroll to Top Button -->
<button id="scrollToTopBtn" title="Go to top" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; border: none; outline: none; background-color: #f96d00; color: white; cursor: pointer; width: 50px; height: 50px; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.3s ease; opacity: 0.8;">
    <i class="fa fa-chevron-up" style="font-size: 20px;"></i>
</button>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var mybutton = document.getElementById("scrollToTopBtn");
        if (mybutton) {
            window.addEventListener("scroll", function() {
                if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                    mybutton.style.display = "flex";
                } else {
                    mybutton.style.display = "none";
                }
            });

            mybutton.addEventListener("click", function() {
                window.scrollTo({top: 0, behavior: 'smooth'});
            });
            
            mybutton.addEventListener("mouseover", function() {
                mybutton.style.opacity = "1";
                mybutton.style.transform = "scale(1.1)";
            });
            mybutton.addEventListener("mouseout", function() {
                mybutton.style.opacity = "0.8";
                mybutton.style.transform = "scale(1.0)";
            });
        }
    });
</script>

</body>
</html>
